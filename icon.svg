<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background: dark navy like the original logo -->
  <rect width="512" height="512" rx="90" fill="#112233"/>
  <!-- Payment terminal body (rounded rect) -->
  <rect x="120" y="110" width="180" height="240" rx="36" fill="none" stroke="#3dbf8a" stroke-width="28"/>
  <!-- Screen lines inside terminal -->
  <line x1="152" y1="182" x2="268" y2="182" stroke="#3dbf8a" stroke-width="22" stroke-linecap="round"/>
  <line x1="152" y1="238" x2="232" y2="238" stroke="#3dbf8a" stroke-width="22" stroke-linecap="round"/>
  <!-- NFC/Contactless arcs from upper-right of terminal -->
  <path d="M300,128 Q410,60 410,230" fill="none" stroke="#3dbf8a" stroke-width="28" stroke-linecap="round"/>
  <path d="M300,178 Q372,132 372,230" fill="none" stroke="#3dbf8a" stroke-width="28" stroke-linecap="round"/>
</svg>
